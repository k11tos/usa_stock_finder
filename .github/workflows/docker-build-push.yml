name: Docker Build & Push to GHCR

# 이 워크플로우는 Docker 이미지 빌드와 GitHub Container Registry에 푸시를 담당합니다
# ARM64 (Raspberry Pi 등) 및 AMD64 플랫폼을 지원합니다
# 안전 규칙:
# - main에서 latest 태그를 발행하고 Pi에 digest 이미지만 pull합니다. stock은 시작/교체하지 않습니다.
# - non-main 수동 실행은 빌드/브랜치 태그 푸시까지만 허용합니다.

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 가능

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: usa_stock_finder

permissions:
  contents: read
  packages: write  # GitHub Container Registry에 푸시하기 위해 필요

jobs:
  build-and-push:
    name: Build & Push Docker Image
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ARM 빌드를 위한 QEMU 설정 (Raspberry Pi 등 지원)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (for tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            # 프로덕션 latest 태그는 main에서만 갱신
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup old untagged GHCR image versions
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: "true"

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  stage-on-raspberry-pi:
    name: Stage image on Raspberry Pi (no strategy execution)
    runs-on: ubuntu-latest
    needs: build-and-push
    # main에서는 이미지만 준비합니다. 예약 실행/컨테이너 교체는 운영 절차를 따릅니다.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Set up Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Tailscale diagnostics
        run: |
          set -euo pipefail
          tailscale status
          tailscale ip -4 || true
          echo "Tailscale diagnostics completed."

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}
          log-public-key: false

      - name: Add Raspberry Pi host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Preserve SSH host key verification by adding the current host key to known_hosts.
          ssh-keyscan "${{ secrets.PI_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull immutable image without recreating or starting stock
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          timeout 10m ssh -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" 'TARGET_DIR="${{ secrets.PI_PROJECT_PATH }}" IMAGE_REF="'"$IMAGE_REF"'" bash -se' <<'REMOTE_SCRIPT'
          set -euo pipefail
          if [ -z "$TARGET_DIR" ]; then
            echo "ERROR: deployment target directory is not configured."
            exit 1
          fi

          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: deployment target directory is missing."
            exit 1
          fi
          echo "Target deployment directory verified."

          cd "$TARGET_DIR"

          if [ ! -f docker-compose.yml ] && [ ! -f docker-compose.yaml ] && [ ! -f compose.yml ] && [ ! -f compose.yaml ]; then
            echo "ERROR: Docker Compose file is missing."
            exit 1
          fi
          echo "Docker Compose file verified."
          docker --version
          docker compose version
          docker login -u ${{ github.actor }} --password-stdin ${{ env.REGISTRY }} <<GITHUB_TOKEN_EOF
          ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN_EOF
          # Staging must not invoke main.py, interrupt a scheduled run, or prune
          # the previous image. Container recreation is an operator rollout step.
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker pull "$IMAGE_REF"
          docker image inspect --format '{{.Os}}/{{.Architecture}} {{.Id}}' "$IMAGE_REF"
          echo "Staged immutable image: $IMAGE_REF"
          echo "stock was not started or recreated. Follow docs/production_rollout.md."
          docker ps -a --filter name=^/stock$ --format '{{.Names}} {{.Status}} {{.Image}}'
          REMOTE_SCRIPT

      # 선택사항: Slack 알림 (SLACK_WEBHOOK_URL secret이 설정된 경우에만)
      # 주의: secrets.SLACK_WEBHOOK_URL을 GitHub 저장소 Settings > Secrets에 추가해야 합니다
      - name: Slack Notification (Success)
        if: success() && github.event_name != 'pull_request'
        uses: slackapi/slack-github-action@v4
        continue-on-error: true  # Slack 알림 실패해도 워크플로우는 계속 진행
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ Docker build/push/stage succeeded; manual rollout required for `${{ github.repository }}` on `${{ github.ref_name }}`."

      - name: Slack Notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v4
        continue-on-error: true  # Slack 알림 실패해도 워크플로우는 계속 진행
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "❌ Docker build/push/stage failed for `${{ github.repository }}` on `${{ github.ref_name }}`. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
